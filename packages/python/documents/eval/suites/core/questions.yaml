# Labelled questions for the core suite (see eval/README.md).
#
# answer: just what the question asks. It's what --answers grades against,
# and context the question didn't ask for counts against an answer that
# leaves it out.
#
# evidence: each item names a document and text that ONE passage must hold
# (its section and text; case, spacing, quotes and dashes folded). Put in
# contains the facts that make that passage self-sufficient: for a nested
# list item, its parents too (the passage must say whose limit it is).
#
# kinds: fact, paraphrase (worded unlike the document), table, hierarchy,
# procedure, diagram, identifier, code, notes (speaker notes), multi_doc,
# unanswerable (answerable: false and no evidence: the search should find nothing).

