name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Lint + whitespace hygiene (tabs, trailing whitespace) — see [tool.ruff.lint].
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11; prove the floor and the ceiling both work.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[dev,mongo]"
      - run: .venv/bin/pyright
      - run: .venv/bin/pytest -q --cov=etf --cov-report=term-missing --cov-fail-under=75
