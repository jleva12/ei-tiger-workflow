[project]
name = "enhanced-task-framework"
version = "0.1.0"
description = "Track, manage, pause, and recover long-running async task runs (Spring Batch-style idempotency, human-in-the-loop validation, full audit)."
# Kept at 3.11 deliberately: the code uses nothing newer, and the mongo
# ecosystem (motor, beanie) lags behind the newest CPython releases.
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Default state store. Install with:  pip install -e ".[mongo]"
mongo = ["beanie>=1.26,<2", "motor>=3.4,<4", "pymongo>=4.6,<5"]
# Opt-in real-infrastructure verification (Mongo replica set).
integration = [
    "beanie>=1.26,<2",
    "motor>=3.4,<4",
    "pymongo>=4.6,<5",
]
# mongomock-motor backs the BeanieStateStore unit tests (they skip if absent).
dev = [
    "mongomock-motor>=0.0.29",
    "pyright>=1.1.400",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # mongomock (test-only dependency) still calls datetime.utcnow() internally.
    "ignore::DeprecationWarning:mongomock",
]
markers = [
    "real_infrastructure: requires explicitly configured external services",
]
timeout = 30

[tool.pyright]
# Tell the type checker that the package lives under src/ (clears spurious
# "Import could not be resolved" diagnostics for intra-package imports).
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes + core pycodestyle errors, and W (tabs / trailing whitespace / EOF newline)
# so the whitespace hygiene enforced in CI can't regress.
select = ["E4", "E7", "E9", "F", "W"]
