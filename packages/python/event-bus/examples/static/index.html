<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bus Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #f8fafc;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected { background: #22c55e; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
        }

        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .panel-body { padding: 16px; }

        /* Controls */
        .controls { display: flex; flex-direction: column; gap: 16px; }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .btn-group { display: flex; flex-direction: column; gap: 8px; }

        button {
            padding: 10px 16px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }

        button:hover { background: #334155; border-color: #475569; }
        button:active { transform: scale(0.98); }

        .btn-primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
            font-weight: 500;
            text-align: center;
        }

        .btn-primary:hover { background: #2563eb; }

        .btn-danger {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
            text-align: center;
        }

        .btn-danger:hover { background: #dc2626; }

        /* Protocol toggle */
        .toggle-group {
            display: flex;
            border: 1px solid #334155;
            border-radius: 6px;
            overflow: hidden;
        }

        .toggle-group button {
            flex: 1;
            border: none;
            border-radius: 0;
            text-align: center;
            padding: 8px;
        }

        .toggle-group button.active {
            background: #3b82f6;
            color: white;
        }

        /* Topic input */
        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 13px;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
        }

        /* Event log */
        .event-log {
            height: calc(100vh - 160px);
            overflow-y: auto;
            padding: 8px;
        }

        .event-item {
            padding: 10px 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .event-item .topic {
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-item .topic-name { color: #38bdf8; }

        .event-item .time {
            font-size: 11px;
            color: #64748b;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        .event-item .source {
            font-size: 11px;
            color: #a78bfa;
            margin-bottom: 4px;
        }

        .event-item .data {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: #94a3b8;
            background: #0f172a;
            padding: 8px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-sse { background: #065f46; color: #6ee7b7; }
        .badge-ws { background: #7c2d12; color: #fdba74; }

        .event-count {
            font-size: 12px;
            color: #64748b;
            padding: 8px 0;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #475569;
        }

        .empty-state p { margin-top: 8px; font-size: 13px; }

        /* Stats bar */
        .stats {
            display: flex;
            gap: 16px;
            padding: 8px 16px;
            border-bottom: 1px solid #334155;
            font-size: 12px;
            color: #64748b;
        }

        .stat-value { color: #e2e8f0; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Event Bus Dashboard</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </div>

    <div class="container">
        <!-- Left panel: controls -->
        <div>
            <div class="panel" style="margin-bottom: 16px;">
                <div class="panel-header">Connection</div>
                <div class="panel-body controls">
                    <div>
                        <div class="section-label">Protocol</div>
                        <div class="toggle-group">
                            <button id="btnSSE" class="active" onclick="setProtocol('sse')">SSE</button>
                            <button id="btnWS" onclick="setProtocol('ws')">WebSocket</button>
                        </div>
                    </div>
                    <div>
                        <div class="section-label">Topic Filter</div>
                        <input type="text" id="topicInput" value="**" placeholder="orders.**, notifications.**">
                    </div>
                    <button class="btn-primary" id="connectBtn" onclick="toggleConnection()">Connect</button>
                </div>
            </div>

            <div class="panel" style="margin-bottom: 16px;">
                <div class="panel-header">Publish Events</div>
                <div class="panel-body controls">
                    <div class="btn-group">
                        <button onclick="createOrder()">
                            <strong>Create Order</strong><br>
                            <small style="color: #64748b">POST /api/orders &rarr; triggers processing chain</small>
                        </button>
                        <button onclick="publishCustom('inventory.low_stock', {sku: 'WIDGET-A', current: 3, threshold: 10})">
                            <strong>Low Stock Alert</strong><br>
                            <small style="color: #64748b">inventory.low_stock</small>
                        </button>
                        <button onclick="publishCustom('system.health', {service: 'api', status: 'healthy', uptime: 86400})">
                            <strong>Health Ping</strong><br>
                            <small style="color: #64748b">system.health</small>
                        </button>
                        <button onclick="publishCustom('alerts.critical', {message: 'CPU usage above 90%', host: 'worker-3'})">
                            <strong>Critical Alert</strong><br>
                            <small style="color: #64748b">alerts.critical</small>
                        </button>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">Actions</div>
                <div class="panel-body">
                    <button class="btn-danger" onclick="clearLog()" style="width: 100%">Clear Event Log</button>
                </div>
            </div>
        </div>

        <!-- Right panel: event log -->
        <div class="panel">
            <div class="panel-header" style="display: flex; justify-content: space-between;">
                <span>Live Events</span>
                <span id="eventCount" class="event-count">0 events</span>
            </div>
            <div class="stats">
                <div>Protocol: <span class="stat-value" id="statProtocol">SSE</span></div>
                <div>Topics: <span class="stat-value" id="statTopics">**</span></div>
                <div>Received: <span class="stat-value" id="statReceived">0</span></div>
            </div>
            <div class="event-log" id="eventLog">
                <div class="empty-state" id="emptyState">
                    <div style="font-size: 32px; opacity: 0.3;">&#9889;</div>
                    <p>No events yet. Connect and publish some events to see them here.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let protocol = 'sse';
        let connection = null;  // AbortController (SSE) or WebSocket
        let eventCount = 0;
        let connected = false;

        function setProtocol(p) {
            if (connected) disconnect();
            protocol = p;
            document.getElementById('btnSSE').className = p === 'sse' ? 'active' : '';
            document.getElementById('btnWS').className = p === 'ws' ? 'active' : '';
            document.getElementById('statProtocol').textContent = p.toUpperCase();
        }

        function toggleConnection() {
            if (connected) {
                disconnect();
            } else {
                connect();
            }
        }

        function connect() {
            const topics = document.getElementById('topicInput').value.trim() || '**';
            document.getElementById('statTopics').textContent = topics;

            if (protocol === 'sse') {
                connectSSE(topics);
            } else {
                connectWS(topics);
            }
        }

        function connectSSE(topics) {
            const url = `/events/sse?topics=${encodeURIComponent(topics)}`;
            const ctrl = new AbortController();
            connection = ctrl;

            fetch(url, { signal: ctrl.signal }).then(async (response) => {
                setConnected(true);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop(); // keep incomplete chunk

                    for (const raw of parts) {
                        if (!raw.trim()) continue;
                        if (raw.trim().startsWith(':')) continue; // heartbeat

                        const lines = raw.split('\n');
                        let eventId = '', eventType = '', eventData = '';

                        for (const line of lines) {
                            if (line.startsWith('id: ')) eventId = line.slice(4);
                            else if (line.startsWith('event: ')) eventType = line.slice(7);
                            else if (line.startsWith('data: ')) eventData = line.slice(6);
                        }

                        if (eventType && eventData) {
                            try {
                                addEvent(eventType, JSON.parse(eventData), 'sse', eventId);
                            } catch (e) {
                                addEvent(eventType, eventData, 'sse', eventId);
                            }
                        }
                    }
                }
            }).catch((err) => {
                if (err.name !== 'AbortError') console.error('SSE error:', err);
            }).finally(() => {
                setConnected(false);
                connection = null;
            });
        }

        function connectWS(topics) {
            const wsUrl = `ws://${location.host}/events/ws`;
            const ws = new WebSocket(wsUrl);
            connection = ws;

            ws.onopen = () => {
                setConnected(true);
                ws.send(JSON.stringify({ action: 'subscribe', topics: topics.split(',').map(t => t.trim()) }));
            };

            ws.onmessage = (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'ping') return; // keep-alive, ignore
                    if (msg.type === 'error') { console.warn('WS error:', msg.error); return; }
                    addEvent(
                        msg.topic || 'unknown',
                        msg.data || msg,
                        'ws',
                        msg.metadata?.event_id || ''
                    );
                } catch (err) {
                    console.error('WS parse error:', err);
                }
            };

            ws.onclose = () => {
                setConnected(false);
                connection = null;
            };

            ws.onerror = () => {};
        }

        function disconnect() {
            if (connection instanceof AbortController) {
                connection.abort();
            } else if (connection instanceof WebSocket) {
                connection.close();
            }
            connection = null;
            setConnected(false);
        }

        function setConnected(state) {
            connected = state;
            document.getElementById('statusDot').className = 'status-dot' + (state ? ' connected' : '');
            document.getElementById('statusText').textContent = state ? 'Connected' : 'Disconnected';
            document.getElementById('connectBtn').textContent = state ? 'Disconnect' : 'Connect';
            document.getElementById('connectBtn').className = state ? 'btn-danger' : 'btn-primary';
        }

        function addEvent(topic, data, proto, eventId) {
            eventCount++;
            document.getElementById('statReceived').textContent = eventCount;
            document.getElementById('eventCount').textContent = eventCount + ' events';

            const empty = document.getElementById('emptyState');
            if (empty) empty.remove();

            const log = document.getElementById('eventLog');
            const item = document.createElement('div');
            item.className = 'event-item';

            const now = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
            const badgeClass = proto === 'sse' ? 'badge-sse' : 'badge-ws';
            const dataStr = typeof data === 'object' ? JSON.stringify(data, null, 2) : String(data);

            // Color-code by topic prefix
            const source = data?.source || (typeof data === 'object' && data.order_id ? 'order' : '');

            item.innerHTML = `
                <div class="topic">
                    <span class="topic-name">${escapeHtml(topic)}</span>
                    <span>
                        <span class="badge ${badgeClass}">${proto.toUpperCase()}</span>
                        <span class="time">${now}</span>
                    </span>
                </div>
                ${eventId ? `<div class="source">id: ${escapeHtml(eventId)}</div>` : ''}
                <div class="data">${escapeHtml(dataStr)}</div>
            `;

            log.insertBefore(item, log.firstChild);

            // Keep max 200 events
            while (log.children.length > 200) {
                log.removeChild(log.lastChild);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function clearLog() {
            const log = document.getElementById('eventLog');
            log.innerHTML = `
                <div class="empty-state" id="emptyState">
                    <div style="font-size: 32px; opacity: 0.3;">&#9889;</div>
                    <p>No events yet. Connect and publish some events to see them here.</p>
                </div>
            `;
            eventCount = 0;
            document.getElementById('statReceived').textContent = '0';
            document.getElementById('eventCount').textContent = '0 events';
        }

        // --- API calls ---

        async function createOrder() {
            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer: 'demo-user',
                        items: [
                            { sku: 'WIDGET-A', qty: Math.floor(Math.random() * 5) + 1 },
                            { sku: 'GADGET-B', qty: Math.floor(Math.random() * 3) + 1 },
                        ],
                        total: Math.round(Math.random() * 500 * 100) / 100,
                    }),
                });
                const data = await res.json();
                console.log('Order created:', data);
            } catch (err) {
                console.error('Failed to create order:', err);
            }
        }

        async function publishCustom(topic, data) {
            try {
                await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, data }),
                });
            } catch (err) {
                console.error('Failed to publish:', err);
            }
        }
    </script>
</body>
</html>
