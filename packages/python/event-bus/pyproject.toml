[project]
name = "event-bus"
version = "0.1.0"
description = "Production-grade, framework-agnostic Python event bus backed by Redis"
authors = [
    {name = "josephleva", email = "joseph.leva.ext@cargomanager.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0,<8.0",
]

[project.optional-dependencies]
msgpack = ["msgpack>=1.0"]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.0",
    "msgpack>=1.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

# msgpack (the optional msgpack extra) ships neither type hints nor stubs.
[[tool.mypy.overrides]]
module = ["msgpack"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
