[project]
name = "forge-task-workflows"
version = "0.1.0"
description = "The workflows task: runs an organization's workflows (forge.workflow/v1) step by step, as tracked, resumable runs of the async worker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "forge-tasks",
  "forge-jsonata",                    # every expression in a workflow is JSONata, evaluated here in Python
  "pydantic>=2.7",
  "jsonschema>=4.23",                 # a run's input, a transform's declared output
  "httpx>=0.27",                      # HTTP steps and the admin API
  "google-genai>=1.20",               # Agent steps' conversations, in its types
  "forge-common[adk-models]",         # Agent steps' models: the shared model_provider.yaml, as the assistant runs them
]

# Registers the task with the Forge async worker.
[project.entry-points."forge_async_worker.tasks"]
workflows = "forge_task_workflows.task:WorkflowsTaskFactory"

[tool.uv.sources]
forge-tasks = { path = "../task-sdk", editable = true }
forge-jsonata = { path = "../../jsonata", editable = true }
forge-common = { path = "../../common", editable = true }

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

# Tests run in the worker app's environment, which installs every task package:
# make async-worker-check, or from here: uv run --project ../../../../apps/forge-async-worker pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["forge_tasks", "forge_task_workflows", "forge_async_worker", "forge_jsonata", "etf"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
