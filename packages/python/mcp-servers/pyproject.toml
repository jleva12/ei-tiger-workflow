[project]
name = "forge-mcp-servers"
version = "0.1.0"
description = "Organizations' MCP servers for Forge's agents: auth methods (API keys, bearer tokens, OAuth), credentials encrypted at rest, and a server as a Google ADK toolset, for the admin API and the async worker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Credentials encrypted at rest (Fernet).
    "cryptography>=50.0.1",
    # Auth methods' own requests (OAuth discovery, token exchange and refresh).
    "httpx2>=2.13.1",
    # Listing a server's tools; ADK's McpToolset, which takes 1.x or 2.x.
    "mcp>=2.3.0,<3",
    "google-adk>=2.9.2",
    "pydantic>=2.11",
    # A server's row, read and its grant kept (SqlServerStore).
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["aiosqlite>=0.20", "uvicorn>=0.30"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["forge_mcp_servers"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
