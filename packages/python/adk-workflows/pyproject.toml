[project]
name = "forge-task-adk-workflows"
version = "0.1.0"
description = "The ADK workflows task: runs an organization's ADK workflows (forge.agent/v1) on Google ADK's graph engine, as resumable runs of the async worker, kept in the run store"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "forge-tasks",
  "forge-jsonata",                    # every expression in a document is JSONata, evaluated here in Python
  "forge-common[adk,adk-models]",     # ADK, and the models of the shared model_provider.yaml
  "google-adk>=2.9.2",
  "pydantic>=2.7",
  "jsonschema>=4.23",
  "httpx>=0.27",                      # HTTP steps
  "sqlalchemy[asyncio]>=2.0",         # sessions in the admin MySQL: ADK's DatabaseSessionService (async: greenlet)
  "aiomysql>=0.2",
]

# Registers the task with the Forge async worker.
[project.entry-points."forge_async_worker.tasks"]
adk_workflows = "forge_task_adk_workflows.task:AdkWorkflowsTaskFactory"

[tool.uv.sources]
forge-tasks = { path = "../task-sdk", editable = true }
forge-jsonata = { path = "../jsonata", editable = true }
forge-common = { path = "../common", editable = true }

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

# Tests run in the worker app's environment, which installs every task package:
# make async-worker-check, or from here: uv run --project ../../../apps/forge-async-worker pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["forge_tasks", "forge_task_adk_workflows", "forge_async_worker", "forge_jsonata"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
