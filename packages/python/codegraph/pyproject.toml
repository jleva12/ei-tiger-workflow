[project]
name = "forge-codegraph"
version = "0.1.0"
description = "The code graph worker's read and search API for Forge: a client, and code search hits as knowledge base passages, for the admin API and the async worker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # The worker's HTTP API (apps/forge-codegraph-worker).
    "httpx2>=2.13.1",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["forge_codegraph"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
