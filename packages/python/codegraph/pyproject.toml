[project]
name = "forge-codegraph"
version = "0.1.0"
description = "System design knowledge bases for their agents: their code searched as knowledge base passages, and their designs described, for the admin API and ADK workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # The code graph, searched as every app searches it.
    "forge-codegraph-query",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["forge_codegraph"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
