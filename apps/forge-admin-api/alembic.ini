# Alembic CLI settings, for commands run from apps/forge-admin-api:
#   uv run alembic revision --autogenerate -m "add projects"
#   uv run alembic upgrade head
# The connection comes from the FORGE_ADMIN_MYSQL_* settings (.env or the
# environment), never from this file. The service applies the same
# migrations at startup unless FORGE_ADMIN_MIGRATE_ON_START=false.

[alembic]
script_location = %(here)s/src/forge_admin/db/migrations
path_separator = os

[post_write_hooks]
# Sort imports and format generated revisions with the project's ruff.
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --exit-zero --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
