# What the Forge assistant has on each screen of the web console
# (agents/screens.py reads it; FORGE_ADMIN_AGENT_SCREENS names another file).
#
# A screen's `when` matches the page context the web console sends with each
# message: `route` is the router's route ID, `search` its search parameters
# (a list matches any; "" matches a page without the parameter), `entity` a
# kind of record on the screen (organization, background_task, ...). Every screen that matches adds its toolsets,
# instructions and prompts, in this order, then `everywhere`'s; the first
# screen with a model sets the default. Put more specific screens first:
# their prompts come first, and at most six are suggested.
#
# Toolsets (agents/forge.py registers them): workflows, events, access and
# administration. Each is held by a specialist
# agent of the same name, which the supervisor is offered on the screens
# that name its toolset. `- name` with `tools` gives the specialist only
# those tools, by the names the model sees. Instructions go to the supervisor
# and to every specialist. A conversation keeps every toolset it has had, so
# a specialist it used, or a change waiting to be confirmed, stays when the
# person moves on.
#
# The page comes from the browser: it decides what's offered, never what the
# person may do. Every tool acts as them.

everywhere:
  toolsets:
    - name: access
      tools: [get_my_access, list_my_memberships, list_available_roles]
  prompts:
    - title: Why was that refused?
      label: and who can give me access
      prompt: Something I tried was refused. Explain which permission I'm missing, which role grants it, and who can give it to me.
    - title: What can I do
      label: here?
      prompt: What roles do I hold and what do they let me do here?

screens:
  # -- Organization members ----------------------------------------------------

  - name: organization-config
    title: Organization members
    when:
      route: /organizations/$organizationId
      search: {view: config}
    toolsets: [access]
    instructions: |
      The person is managing their organization's members. Its scope is
      org:<the organization's ID from the page>. Look people up with
      find_people and roles with list_available_roles(level="org") before
      giving or removing one.
    prompts:
      - title: Who's in this organization
        label: and what can each do?
        prompt: List this organization's members with their roles, including site roles that apply here.
      - title: Add someone
        label: to this organization
        prompt: Help me give someone a role in this organization. Ask me who and which role.
      - title: Who can manage
        label: this organization's members?
        prompt: Who can give or remove roles in this organization?

  # -- Events ------------------------------------------------------------------

  - name: events-received
    title: Received events
    when:
      route: /organizations/$organizationId
      search: {view: events, eventsTab: received}
    prompts:
      - title: Why were events rejected
        label: recently?
        prompt: Which of this organization's recent events were rejected, and why? Explain each problem in plain words.
      - title: What arrived
        label: most recently?
        prompt: Summarize the last events this organization received, by event type.
      - title: Would they pass now?
        label: against the current schemas
        prompt: Would this organization's most recent rejected events pass their event types' current schemas?

  - name: event-type-test
    title: Test an event type
    when:
      route: /organizations/$organizationId
      search: {view: events, eventTab: test}
    instructions: |
      The person is on an event type's Test tab; the page's eventType search
      parameter is its ID. Check sample payloads with validate_event_schema
      and that event_type_id.
    prompts:
      - title: Write a sample payload
        label: that passes this schema
        prompt: Write a realistic sample payload that passes this event type's schema, and check it.
      - title: What does this schema require?
        prompt: Explain in plain words what this event type's schema requires of a payload.
      - title: Would the last rejected event pass?
        prompt: Would this event type's most recent rejected event pass its schema now? If not, why not?

  - name: events
    title: Events
    when:
      route: /organizations/$organizationId
      search: {view: events}
    toolsets: [events]
    instructions: |
      The person is on their organization's Events page: its event types, the events
      it received and its inbound endpoint (the eventsTab search parameter;
      event types when absent). An eventType search parameter is the event
      type open (its ID, or `new` while they define one), and eventTab its tab.
      The endpoint's token is only ever shown here: they turn the endpoint on
      the first time, or replace its token, on the Endpoint tab.
    prompts:
      - title: Can events arrive?
        label: is our endpoint on?
        prompt: Is this organization's event endpoint on, where do senders post, and which event types accept events?
      - title: Define an event type
        label: with me
        prompt: Help me define a new event type for this organization. Ask me what sends it and what its payload holds, then draft its JSON Schema.
      - title: Which types reject events?
        prompt: Which of this organization's event types have rejected events, and what's usually wrong?

  # -- Workflows and background tasks ------------------------------------------

  - name: workflow-builder
    title: Workflow builder
    when:
      route: /organizations/$organizationId_/workflows/$workflowId
    toolsets:
      - name: workflows
        tools:
          - get_workflow
          - get_workflow_building_blocks
          - check_workflow_draft
          - create_workflow
          - save_workflow
          - list_workflow_runs
          - get_background_task
          - list_workflow_approvals
          - run_workflow
          - decide_workflow_approval
    instructions: |
      The person is in the builder of one of their organization's workflows; its ID
      is the URL's workflowId. You can explain it, run it as it is saved
      (unsaved edits don't run), and follow and decide its runs. You can
      also draft a workflow from what they describe and make it a new
      workflow, or, when they ask, save it over this one: the builder shows
      that once reloaded, and edits they haven't saved would be offered back
      as theirs.
    prompts:
      - title: Build a workflow
        label: from a description
        prompt: Help me build a workflow. Ask me what should start it, what it should do step by step and what it needs, then draft it for me to review.
      - title: Explain this workflow
        label: step by step
        prompt: Explain what this workflow does, step by step, and what input a run needs.
      - title: How did its runs go
        label: lately?
        prompt: How did this workflow's recent runs go? Is any waiting for a decision, or failed?
      - title: Run it
        label: with me
        prompt: Help me run this workflow. Tell me what input it needs and ask me for it.

  - name: background-task
    title: A background task
    when:
      route: /organizations/$organizationId
      entity: background_task
    toolsets: [workflows]
    prompts:
      - title: What happened here?
        label: in plain words
        prompt: What is this background task, how did it go, and if it failed, why?
      - title: What does it wait for?
        prompt: What is this run waiting for, and what has it done so far?
      - title: Restart or resubmit?
        label: or abandon it
        prompt: Should this task be restarted, resubmitted or abandoned? Explain the difference for this one.

  - name: workflows
    title: Workflows
    when:
      route: /organizations/$organizationId
      search: {view: ["", workflows]}
    toolsets: [workflows]
    prompts:
      - title: Build a workflow
        label: from a description
        prompt: Help me build a new workflow. Ask me what should start it, what it should do step by step and what it needs, then draft it for me to review.
      - title: What do our workflows do?
        prompt: List this organization's workflows and say what each does and how it starts.
      - title: Run a workflow
        label: with me
        prompt: Help me run one of this organization's workflows. Ask me which one and what input to give it.
      - title: Anything waiting
        label: for a decision?
        prompt: Are any of this organization's workflow runs waiting for someone to approve or reject them?
      - title: How did our runs go
        label: lately?
        prompt: How did this organization's recent workflow runs go? Which failed, and why?

  # -- The rest of the organization's workspace ---------------------------------

  - name: organization
    title: Organization workspace
    when:
      route: /organizations/$organizationId
    toolsets:
      - name: workflows
        tools: [list_workflow_approvals]

  # -- Administration ----------------------------------------------------------

  - name: admin-organization
    title: Organization administration
    when:
      route: /admin/organizations/$organizationId/
    toolsets:
      - name: administration
        tools:
          - get_organization
          - update_organization
          - list_users
      - access
    instructions: |
      The person administers this organization. Its members' scope is
      org:<the organization's ID from the page>.
    prompts:
      - title: Who's in this organization
        label: and what can each do?
        prompt: List this organization's members with their roles, including site roles that apply here.
      - title: Add someone
        label: to this organization
        prompt: Help me give someone a role in this organization. Ask me who and which role.
      - title: Update this organization
        label: name or description
        prompt: Help me update this organization's name or description.

  - name: admin-organizations
    title: Organizations
    when:
      route: /admin/organizations/
    toolsets:
      - name: administration
        tools:
          - list_organizations
          - get_organization
          - create_organization
          - update_organization
    prompts:
      - title: Our organizations
        label: at a glance
        prompt: List our organizations and what each is for.
      - title: Create an organization
        label: with me
        prompt: Help me create a new organization. Ask me its name and description.

  - name: admin-users
    title: Users
    when:
      route: /admin/users
    toolsets:
      - name: administration
        tools: [list_users, get_user, create_user, update_user]
    prompts:
      - title: Find someone
        label: by name or email
        prompt: Help me find a user. Ask me who I'm looking for.
      - title: Add a person
        label: to Forge
        prompt: Help me add a new user. Ask me for their names, email and MS ID.
      - title: Update someone's details
        prompt: Help me change a user's name, email or MS ID.

  - name: admin-roles
    title: Roles
    when:
      route: /admin/roles
    toolsets:
      - name: administration
        tools:
          - list_role_definitions
          - get_role_definition
          - create_role_definition
          - update_role_definition
          - list_permission_definitions
    prompts:
      - title: Compare the roles
        label: and what each grants
        prompt: Compare our roles by level and the permissions each grants.
      - title: Which roles grant
        label: a permission?
        prompt: Which roles grant a given permission? Ask me which one.
      - title: Create a role
        label: with me
        prompt: Help me create a role. Ask me its level, name and which permissions it should grant.

  - name: admin-permissions
    title: Permissions
    when:
      route: /admin/permissions
    toolsets:
      - name: administration
        tools:
          - list_permission_definitions
          - get_permission_definition
          - create_permission_definition
          - update_permission_definition
          - list_role_definitions
    prompts:
      - title: Explain our permissions
        label: by resource
        prompt: Group our permissions by resource and explain what each allows.
      - title: Which roles hold
        label: a permission?
        prompt: Which roles grant a given permission? Ask me which one.
