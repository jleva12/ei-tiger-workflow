# What the Forge assistant has on each screen of the web console
# (assistant/screens.py reads it; FORGE_ADMIN_AGENT_SCREENS names another file).
#
# A screen's `when` matches the page context the web console sends with each
# message: `route` is the router's route ID, `search` its search parameters
# (a list matches any; "" matches a page without the parameter), `entity` a
# kind of record on the screen (organization, ...). Every screen that matches
# adds its toolsets, instructions and prompts, in this order, then
# `everywhere`'s; the first screen with a model sets the default. Put more
# specific screens first: their prompts come first, and at most six are
# suggested.
#
# Toolsets (assistant/forge.py registers them): access, administration,
# knowledge, code, workflows and agents. Each
# is held by a specialist agent of the same name, which the supervisor is
# offered on the screens that name its toolset. `- name` with `tools` gives the specialist only
# those tools, by the names the model sees. Instructions go to the supervisor
# and to every specialist. A conversation keeps every toolset it has had, so
# a specialist it used, or a change waiting to be confirmed, stays when the
# person moves on.
#
# The page comes from the browser: it decides what's offered, never what the
# person may do. Every tool acts as them.

everywhere:
  toolsets:
    - name: access
      tools: [get_my_access, list_my_memberships, list_available_roles]
    # Asking what the organization's documents say works from any page; an
    # organization's ID comes from the page or list_my_memberships.
    - name: knowledge
      tools:
        - list_knowledge_bases
        - get_knowledge_base
        - list_knowledge_documents
        - get_knowledge_document
        - search_knowledge_bases
    # Asking how the organization's code works works from any page too: the
    # code graph MCP server's tools, every one read-only.
    - name: code
  prompts:
    - title: Why was that refused?
      label: and who can give me access
      prompt: Something I tried was refused. Explain which permission I'm missing, which role grants it, and who can give it to me.
    - title: What can I do
      label: here?
      prompt: What roles do I hold and what do they let me do here?

screens:
  # -- Organization members ----------------------------------------------------

  - name: organization-config
    title: Organization members
    when:
      route: /organizations/$organizationId
      search: {view: config}
    toolsets: [access]
    instructions: |
      The person is managing their organization's members. Its scope is
      org:<the organization's ID from the page>. Look people up with
      find_people and roles with list_available_roles(level="org") before
      giving or removing one.
    prompts:
      - title: Who's in this organization
        label: and what can each do?
        prompt: List this organization's members with their roles, including site roles that apply here.
      - title: Add someone
        label: to this organization
        prompt: Help me give someone a role in this organization. Ask me who and which role.
      - title: Who can manage
        label: this organization's members?
        prompt: Who can give or remove roles in this organization?

  # -- Knowledge bases ---------------------------------------------------------

  - name: knowledge-base
    title: Knowledge base
    when:
      route: /organizations/$organizationId_/knowledge/$knowledgeBaseId
    toolsets: [knowledge, code]
    instructions: |
      The person is on one of their organization's knowledge bases: the
      organization is the page's organizationId parameter and the knowledge
      base its knowledgeBaseId (also the knowledge_base on the page). A
      document search parameter is the document open in its viewer, by its
      ID. "This knowledge base" is this one: search it, unless they name
      others. On a system design knowledge base, the code specialist reads
      its applications' code: a repository search parameter is the code
      repository open in its explorer, by Forge's ID (match it by owner/name
      in list_repositories), and a node parameter the node selected in its
      graph, by the code graph's node id.
    prompts:
      - title: Ask this knowledge base
        label: a question
        prompt: I have a question about what this knowledge base's documents say. Ask me what it is, then answer from them with citations.
      - title: What's in it
        label: and what is it for?
        prompt: Summarize what this knowledge base holds and how many of its documents are searchable.
      - title: Which documents failed
        label: and why?
        prompt: Which of this knowledge base's documents failed to ingest, and why? Offer to retry them.
      - title: Is it up to date?
        label: stale documents
        prompt: Are any of this knowledge base's documents stale? If so, explain what that means and offer to re-index them.

  - name: organization-knowledge
    title: Knowledge bases
    when:
      route: /organizations/$organizationId
      search: {view: knowledge}
    toolsets: [knowledge]
    instructions: |
      The person is looking at their organization's knowledge bases (the
      page's organizationId parameter is the organization).
    prompts:
      - title: Ask our documents
        label: a question
        prompt: I have a question about what our knowledge bases' documents say. Ask me what it is, then answer from them with citations.
      - title: Our knowledge bases
        label: at a glance
        prompt: List this organization's knowledge bases, what each holds and how many of their documents are searchable.

  # -- The workflow builder ------------------------------------------------------

  - name: workflow-builder
    title: Workflow builder
    when:
      route: /organizations/$organizationId_/agents/$agentId
    toolsets: [workflows]
    # Planning a workflow and wiring its data takes some thought.
    thinking_level: medium
    instructions: |
      The person is building one of their organization's ADK workflows on
      its canvas: the organization is the page's organizationId parameter
      and the workflow its agentId parameter (also the adk_workflow on the
      page). "This workflow", "it" and "here" mean that one. A node they
      selected is in focus (a workflow_node, by its id): "this step" or
      "this node" is it. A version search parameter means they're looking at
      a published version, which never changes: edits go to its draft.
      Hand every request to understand, design, build, change, check, test
      or debug the workflow to the workflow builder specialist, with the
      organization's and the workflow's IDs, the node in focus, and the
      person's whole goal in their words: it reads the workflow itself, and
      the person sees its changes on the canvas as it makes them. Many of
      the people building workflows aren't technical: answer in plain
      words. The specialist reports in two parts, "For the person" and
      "Details": answer from the first, in its words, and keep the details
      (node ids, expressions such as steps.x.output.y, JSON, settings) to
      yourself unless the person asks for them; here that comes before
      keeping the specialist's IDs. Name steps as the canvas shows them
      ("Look up the customer"), and say where data comes from in words
      ("the number of stars, straight from GitHub"). End with what's left
      for them to do, if anything.
    prompts:
      - title: Build it with me
        label: from what it should do
        prompt: Help me build this workflow. Ask me what it should do, propose the steps in plain words, then build them on the canvas.
      - title: Explain this workflow
        label: step by step
        prompt: Explain what this workflow does, step by step, in plain words, and what each step uses from the steps before it.
      - title: Will it run?
        label: check and fix it
        prompt: Check this workflow. Will it run? Fix anything that's wrong or missing, then tell me what you changed.
      - title: Test it
        label: with sample input
        prompt: Test-run this workflow's draft with a realistic sample input and tell me what each step did.
      - title: Handle failures
        label: errors and retries
        prompt: Make this workflow handle failures well, such as an API that answers an error or a step that fails. Propose what should happen, then build it.
      - title: Why did it fail?
        label: the last run
        prompt: Look at this workflow's latest run. If it failed, explain why in plain words and offer to fix the workflow.

  # -- The agent builder ---------------------------------------------------------

  - name: agent-builder
    title: Agent builder
    when:
      route: /organizations/$organizationId_/chat-agents/$chatAgentId
    toolsets: [agents]
    # Designing an agentic system and its instructions takes some thought.
    thinking_level: medium
    instructions: |
      The person is building one of their organization's agents on its
      canvas, on the Agents page: the organization is the page's
      organizationId parameter and the agent its chatAgentId parameter
      (also the chat_agent on the page). "This agent", "it" and "here" mean
      that one. A node they selected is in focus (a chat_agent_node, by its
      id): "this tool", "this node" or "this sub-agent" is it. A version
      search parameter means they're looking at a published version, which
      never changes: changes go to its draft. Hand every request to
      understand, design, build, change, check or try the agent to the agent
      builder specialist, with the organization's and the agent's IDs, the
      node in focus, and the person's whole goal in their words: it reads the
      agent and what the organization has itself, and the person sees its
      changes on the canvas as it makes them. Many of the people building
      agents aren't technical: answer in plain words. The specialist reports
      in two parts, "For the person" and "Details": answer from the first, in
      its words, and keep the details (node ids, settings, JSON) to yourself
      unless the person asks for them; here that comes before keeping the
      specialist's IDs. Name parts as the canvas shows them ("Search HR
      policies"). End with what's left for them to do, if anything.
    prompts:
      - title: Build it with me
        label: from what it should do
        prompt: Help me build this agent. Ask me what it should do and who it's for, propose how it will work in plain words, then build it on the canvas with its tools and instructions.
      - title: Explain this agent
        label: in plain words
        prompt: Explain what this agent does in plain words, what each of its parts is for, and what it can't do yet.
      - title: Will it work?
        label: check and fix it
        prompt: Check this agent. Will it work? Fix anything that's wrong or missing, then tell me what you changed.
      - title: Try it
        label: with a few messages
        prompt: Try this agent with a few realistic messages and tell me how it answered and which tools it used.
      - title: Give it more to work with
        label: tools, documents, workflows
        prompt: What could this agent use from our organization (knowledge bases, workflows, systems, other agents) to do its job better? Suggest it in plain words, then add what I pick.
      - title: Improve its instructions
        label: tone, steps and rules
        prompt: Improve this agent's instructions. Ask me what it should do better, then rewrite them.

  # -- The organization's agents --------------------------------------------------

  - name: organization-agents
    title: Agents
    when:
      route: /organizations/$organizationId
      search: {view: chat-agents}
    toolsets: [agents]
    thinking_level: medium
    instructions: |
      The person is on their organization's Agents page, which lists its
      agents (the page's organizationId parameter is the organization). The
      agent builder specialist reads them, and makes a new one and builds it
      when the person describes what they need: hand it their whole goal, in
      their words. Each agent opens on its own canvas; give the person the
      link the specialist reports.
    prompts:
      - title: Build me an agent
        label: from what it should do
        prompt: Help me make a new agent. Ask me what it should do and who it's for, propose how it will work in plain words, then build it.
      - title: Our agents
        label: at a glance
        prompt: List this organization's agents, what each is for, and which are published.

  # -- The rest of the organization's workspace ---------------------------------

  - name: organization
    title: Organization workspace
    when:
      route: /organizations/$organizationId
    toolsets:
      - name: workflows
        tools:
          - list_workflows
          - get_workflow
          - describe_node_kinds
          - list_workflow_runs
          - get_workflow_run
      - name: agents
        tools: [list_agents, get_agent, describe_agent_parts]
    instructions: |
      The person is in their organization's workspace: its ADK workflows (the
      page without a view; an agentRun search parameter is one run's page, by
      the run's ID, with its steps, its activity and what it waits for; the
      page names it as an adk_run), its agents (view chat-agents), the audit
      of its agents' and assistant's conversations, for its admins (view
      conversations), its
      knowledge bases (view knowledge) and its members (view config). The
      workflow builder specialist reads the organization's ADK workflows and
      their runs here, and explains why a run failed; it builds and changes
      a workflow on the workflow's own page (its canvas): point the person
      there to build one. The agent builder specialist reads the
      organization's agents here; it makes and builds them on the Agents
      page and on each agent's own canvas: point the person there to build
      one. The knowledge specialist reads and searches the organization's
      knowledge bases.

  # -- Administration ----------------------------------------------------------

  - name: admin-organization
    title: Organization administration
    when:
      route: /admin/organizations/$organizationId/
    toolsets:
      - name: administration
        tools:
          - get_organization
          - update_organization
          - list_users
      - access
    instructions: |
      The person administers this organization. Its members' scope is
      org:<the organization's ID from the page>.
    prompts:
      - title: Who's in this organization
        label: and what can each do?
        prompt: List this organization's members with their roles, including site roles that apply here.
      - title: Add someone
        label: to this organization
        prompt: Help me give someone a role in this organization. Ask me who and which role.
      - title: Update this organization
        label: name or description
        prompt: Help me update this organization's name or description.

  - name: admin-organizations
    title: Organizations
    when:
      route: /admin/organizations/
    toolsets:
      - name: administration
        tools:
          - list_organizations
          - get_organization
          - create_organization
          - update_organization
    prompts:
      - title: Our organizations
        label: at a glance
        prompt: List our organizations and what each is for.
      - title: Create an organization
        label: with me
        prompt: Help me create a new organization. Ask me its name and description.

  - name: admin-users
    title: Users
    when:
      route: /admin/users
    toolsets:
      - name: administration
        tools: [list_users, get_user, create_user, update_user]
    prompts:
      - title: Find someone
        label: by name or email
        prompt: Help me find a user. Ask me who I'm looking for.
      - title: Add a person
        label: to Forge
        prompt: Help me add a new user. Ask me for their names, email and MS ID.
      - title: Update someone's details
        prompt: Help me change a user's name, email or MS ID.

  - name: admin-roles
    title: Roles
    when:
      route: /admin/roles
    toolsets:
      - name: administration
        tools:
          - list_role_definitions
          - get_role_definition
          - create_role_definition
          - update_role_definition
          - list_permission_definitions
    prompts:
      - title: Compare the roles
        label: and what each grants
        prompt: Compare our roles by level and the permissions each grants.
      - title: Which roles grant
        label: a permission?
        prompt: Which roles grant a given permission? Ask me which one.
      - title: Create a role
        label: with me
        prompt: Help me create a role. Ask me its level, name and which permissions it should grant.

  - name: admin-permissions
    title: Permissions
    when:
      route: /admin/permissions
    toolsets:
      - name: administration
        tools:
          - list_permission_definitions
          - get_permission_definition
          - create_permission_definition
          - update_permission_definition
          - list_role_definitions
    prompts:
      - title: Explain our permissions
        label: by resource
        prompt: Group our permissions by resource and explain what each allows.
      - title: Which roles hold
        label: a permission?
        prompt: Which roles grant a given permission? Ask me which one.
