# Forge access model, shared by every Casbin enforcer: this API, the web
# console and other services. GET /api/v1/authz/model serves this file.
#
# A request asks whether a subject may perform an action on a resource within
# a domain, the scope it acts in:
#   site | org:<id>
#
# p lines grant a permission to a role, the same in every scope:
#   p, org:admin, workflows, manage
# g lines assign a role to a subject within a domain pattern. The pattern is
# the scope followed by *; the site's pattern, *, covers every organization:
#   g, <user id>, org:member, org:<id>*
#
# Enforcers must register keyMatch as the domain matching function for g:
#   Python  enforcer.add_named_domain_matching_func("g", casbin.util.key_match)
#   JS      enforcer.addNamedDomainMatchingFunc("g", Util.keyMatch)
#   Go      enforcer.AddNamedDomainMatchingFunc("g", "KeyMatch", util.KeyMatch)

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
