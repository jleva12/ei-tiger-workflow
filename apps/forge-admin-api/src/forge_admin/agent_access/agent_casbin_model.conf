# Forge's agent access model: each organization's own agent permissions,
# apart from the site's roles and permissions (forge_admin/auth/casbin_model.conf),
# which decide what people see and do in Forge itself. Its policy lives in
# the agent_casbin_rule table.
#
# A request asks whether a subject may perform an action on a resource in an
# organization's domain, org:<id>. Every line names its domain, and counts
# only there. Each links an agent permission to a company group (from the
# external directory; whoever's sign-in names it holds it), or to one of
# the organization's API keys:
#   p, group:Finance, org:<id>, invoices, approve
#   p, apikey:<id>, org:<id>, invoices, approve
#
# There are no roles: the company's groups are who's who. Either part of a
# permission may be *, for every resource or every action.

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && r.dom == p.dom && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
