# The admin API and MySQL, using the root stack's shared MongoDB and Redis.
# Run from the repository root with make up (make admin runs the API natively).
# Settings come from apps/forge-admin-api/.env, whose ${NAME} references Compose resolves
# from .env.common (the root Makefile passes it with --env-file); the
# environment below overrides the listener and points the service at
# admin-mysql and mongo.

# Shared by the API and the seed: the admin-mysql connection. The rest,
# including the bearer token secret and the site administrator the seed adds,
# comes from ./.env. Requests sign in with a bearer token, as in production.
x-admin-environment: &admin-environment
  FORGE_ADMIN_MYSQL_HOST: admin-mysql
  FORGE_ADMIN_MYSQL_PORT: "3306"
  FORGE_ADMIN_MYSQL_DATABASE: ${ADMIN_MYSQL_DATABASE:-forge_admin}
  FORGE_ADMIN_MYSQL_USER: ${ADMIN_MYSQL_USER:-forge_admin}
  FORGE_ADMIN_MYSQL_PASSWORD: ${ADMIN_MYSQL_PASSWORD:-local-admin}

# ADK workflows use their own database on the shared local Atlas instance.
x-mongo-uri: &mongo-uri mongodb://${FORGE_MONGO_USER:-forge}:${FORGE_MONGO_PASSWORD:-local-forge}@mongo:27017/?authSource=admin&directConnection=true

x-admin-build: &admin-build
  context: ../..
  dockerfile: apps/forge-admin-api/Dockerfile

services:
  admin-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${ADMIN_MYSQL_DATABASE:-forge_admin}
      MYSQL_USER: ${ADMIN_MYSQL_USER:-forge_admin}
      MYSQL_PASSWORD: ${ADMIN_MYSQL_PASSWORD:-local-admin}
      MYSQL_ROOT_PASSWORD: ${ADMIN_MYSQL_ROOT_PASSWORD:-local-root}
    ports:
      - "127.0.0.1:${ADMIN_MYSQL_PORT:-13326}:3306"
    volumes:
      - admin-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
  admin:
    build: *admin-build
    init: true
    restart: unless-stopped
    depends_on:
      admin-mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *admin-environment
      # Links go to this stack's web console.
      FORGE_ADMIN_WEB_URL: http://localhost:${WEB_PORT:-18190}
      FORGE_ADMIN_HOST: 0.0.0.0
      FORGE_ADMIN_PORT: "8091"
      FORGE_ADMIN_RELOAD: "false"
      # Organizations' ADK workflows, in their own database on the shared mongo.
      FORGE_ADMIN_MONGO_URI: *mongo-uri
      FORGE_ADMIN_MONGO_DATABASE: ${ADMIN_MONGO_DATABASE:-forge_admin}
      # The async worker's job queues, in this stack
      # (apps/forge-async-worker/compose.yaml), where the jobs that take ADK
      # workflow runs are queued; the runs themselves are kept in admin-mysql.
      # Connected lazily, so no depends_on: a job that can't be queued yet is
      # found later by the worker's maintenance.
      FORGE_ADMIN_EMBEDDING_REDIS_URL: redis://redis:6379/0
      # Knowledge bases: uploads stored in this stack's RustFS (knowledge-s3),
      # whose bucket is made on first use; their chunks, which the async
      # worker embeds, searched in the shared mongo's forge_knowledge database.
      FORGE_ADMIN_DOCUMENTS_BUCKET: ${FORGE_DOCUMENTS_BUCKET:-forge-knowledge}
      FORGE_ADMIN_S3_ENDPOINT_URL: http://knowledge-s3:9000
      FORGE_ADMIN_S3_ACCESS_KEY_ID: ${FORGE_S3_ACCESS_KEY_ID:-forge-local}
      FORGE_ADMIN_S3_SECRET_ACCESS_KEY: ${FORGE_S3_SECRET_ACCESS_KEY:-local-forge-secret}
      FORGE_ADMIN_S3_CREATE_BUCKET: "true"
      FORGE_ADMIN_KNOWLEDGE_DATABASE: ${FORGE_KNOWLEDGE_DATABASE:-forge_knowledge}
      # Where the ready-made code explorer MCP server is on the stack's network
      # (apps/forge-codegraph-mcp), for servers added from it: the admin API
      # and the async worker both reach it there.
      FORGE_ADMIN_CODEGRAPH_MCP_URL: http://codegraph-mcp:8103/mcp
      # Graph knowledge bases and the code graph explorer: the code graph
      # worker's API on the stack's network (apps/forge-codegraph-worker),
      # with its token from .env.common. Called on use, so no depends_on.
      FORGE_ADMIN_CODEGRAPH_URL: http://worker:8080
      FORGE_ADMIN_CODEGRAPH_TOKEN: ${FORGE_CODEGRAPH_ADMISSION_TOKEN:-}
      # Searches embedded with the model every app shares (FORGE_EMBEDDING_*
      # in .env.common), as the async worker embedded the chunks.
      FORGE_ADMIN_KNOWLEDGE_EMBEDDING__DOCUMENT_MODEL: ${FORGE_EMBEDDING_MODEL:-text-embedding-3-large}
      FORGE_ADMIN_KNOWLEDGE_EMBEDDING__DIMENSIONS: ${FORGE_EMBEDDING_DIMENSIONS:-1024}
      FORGE_ADMIN_KNOWLEDGE_EMBEDDING__BASE_URL: ${FORGE_EMBEDDING_BASE_URL:-}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-18201}:8091"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
  # One-shot: applies migrations, which create the default roles and
  # permissions, then adds the site administrator (FORGE_ADMIN_SITE_ADMIN_* in
  # ./.env) to users with site:admin. make infrastructure runs it; the tools
  # profile keeps it out of make up.
  admin-seed:
    build: *admin-build
    profiles: [tools]
    entrypoint: ["forge-admin-seed"]
    restart: "no"
    depends_on:
      admin-mysql:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
    environment: *admin-environment
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  admin-mysql-data:
