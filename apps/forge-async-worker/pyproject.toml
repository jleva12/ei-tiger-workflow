[project]
name = "forge-async-worker"
version = "0.3.0"
description = "The async worker: runs organizations' ADK workflow runs, kept in the admin MySQL, off a SAQ queue on Redis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "forge-tasks",
  # The ADK workflows task (it registers itself: entry point group
  # "forge_async_worker.tasks"), and the run store its runs live in.
  "forge-task-adk-workflows",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  # SAQ (asyncio job queue) on Redis.
  # SAQ is 0.x and the worker relies on its job and cron internals: pin the minor.
  "saq[redis]>=0.26.4,<0.27",
  # the run store, in the admin MySQL (aiomysql comes with the ADK workflows task)
  "sqlalchemy[asyncio]>=2.0",
  # structured logs for every logger (forge_common.logging)
  "forge-common[logging]",
]

[project.scripts]
forge-async-worker = "forge_async_worker.cli:main"

[tool.uv.sources]
forge-tasks = { path = "../../packages/python/task-sdk", editable = true }
forge-task-adk-workflows = { path = "../../packages/python/adk-workflows", editable = true }
forge-jsonata = { path = "../../packages/python/jsonata", editable = true }
forge-common = { path = "../../packages/python/common", editable = true }

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.5",
  "httpx>=0.27",
  "aiosqlite>=0.20",   # the run store on SQLite, in tests
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "redis: needs a running Redis (HYBRID_TEST_REDIS_URL); run with make async-worker-test-redis",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["forge_tasks", "forge_task_adk_workflows", "forge_async_worker", "forge_jsonata"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
