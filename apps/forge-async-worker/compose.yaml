# The async worker (forge-async-worker): ADK workflow runs off the
# adk_workflows queue, and knowledge base documents off the documents queue. Redis is a shared service in compose.infrastructure.yaml;
# the runs and their ADK sessions are in the admin MySQL (admin-mysql).
# Included by the root compose.yaml; run make async-worker or make up.
# Settings come from apps/forge-async-worker/.env, whose ${NAME} references
# Compose resolves from .env.common (the root Makefile passes it with
# --env-file); the environment below overrides the connections to reach
# redis and admin-mysql. Its knobs are ASYNC_WORKER_* variables from
# .env.compose, never HYBRID_*: Compose also interpolates this file from
# apps/forge-async-worker/.env, whose native settings must not leak into the
# containers.

# Replicas share the queue; the maintenance cron runs once a minute however
# many serve it.
x-async-worker: &async-worker
  build:
    context: ../..
    dockerfile: apps/forge-async-worker/Dockerfile
  image: forge-async-worker:local
  init: true
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  env_file:
    - path: ./.env
      required: false
  environment: &async-worker-environment
    HYBRID_REDIS_URL: redis://redis:6379/0
    # The embedding model every app shares (FORGE_EMBEDDING_* in .env.common):
    # knowledge base chunks are embedded, and searched, with it.
    HYBRID_EMBEDDING__DOCUMENT_MODEL: ${FORGE_EMBEDDING_MODEL:-text-embedding-3-large}
    HYBRID_EMBEDDING__DIMENSIONS: ${FORGE_EMBEDDING_DIMENSIONS:-1024}
    HYBRID_EMBEDDING__BASE_URL: ${FORGE_EMBEDDING_BASE_URL:-}
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Running runs get 30 seconds to finish, then go back to their queue, and
  # carry on where they were on the next worker.
  stop_grace_period: ${ASYNC_WORKER_STOP_GRACE_PERIOD:-1m}

services:
  # The adk_workflows queue: runs of organizations' ADK workflows, on Google
  # ADK's graph engine. Runs (the run store) and their ADK sessions are in the
  # admin MySQL (admin-mysql, with the admin API's credentials from
  # .env.compose), where the admin API starts, lists and acts on them. A run
  # that waits (an approval, human input, a delay) lets its worker go.
  async-worker-adk-workflows:
    <<: *async-worker
    command:
      - forge-async-worker
      - worker
      - --ensure-schema
      - --queues=adk_workflows
      - --concurrency=${ASYNC_WORKER_ADK_WORKFLOWS_CONCURRENCY:-8}
    depends_on:
      redis:
        condition: service_healthy
      admin-mysql:
        condition: service_healthy
    environment:
      <<: *async-worker-environment
      HYBRID_ADK_WORKFLOWS__SESSION_DATABASE_URL: mysql+aiomysql://${ADMIN_MYSQL_USER:-forge_admin}:${ADMIN_MYSQL_PASSWORD:-local-admin}@admin-mysql:3306/${ADMIN_MYSQL_DATABASE:-forge_admin}
      HYBRID_ADK_WORKFLOWS__GOOGLE_API_KEY: ${FORGE_GOOGLE_API_KEY:-}
      # Graph knowledge bases' search: the code graph worker's API on the
      # stack's network, with its token from .env.common.
      HYBRID_ADK_WORKFLOWS__CODEGRAPH_URL: http://worker:8080
      HYBRID_ADK_WORKFLOWS__CODEGRAPH_TOKEN: ${FORGE_CODEGRAPH_ADMISSION_TOKEN:-}
      # The files runs start with: ADK artifacts the admin API saved in the
      # stack's RustFS.
      HYBRID_ADK_WORKFLOWS__ARTIFACTS: ${FORGE_WORKFLOW_ARTIFACTS:-s3://forge-artifacts/workflows}
      HYBRID_ADK_WORKFLOWS__S3_ENDPOINT_URL: http://knowledge-s3:9000
      HYBRID_ADK_WORKFLOWS__S3_REGION: us-east-1
      HYBRID_ADK_WORKFLOWS__S3_ACCESS_KEY_ID: ${FORGE_S3_ACCESS_KEY_ID:-forge-local}
      HYBRID_ADK_WORKFLOWS__S3_SECRET_ACCESS_KEY: ${FORGE_S3_SECRET_ACCESS_KEY:-local-forge-secret}
    healthcheck:
      test: ["CMD", "forge-async-worker", "worker", "--check", "--queues=adk_workflows"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 6
    deploy:
      replicas: ${ASYNC_WORKER_ADK_WORKFLOWS_REPLICAS:-1}
  # The documents queue: knowledge base documents the admin API stored in
  # knowledge-s3, parsed, chunked and embedded into the shared mongo's
  # forge_knowledge database (Atlas Search and Vector Search indexes, which
  # --ensure-schema creates), and removed again. Embeds with OpenAI
  # (OPENAI_API_KEY from .env.common, via ./.env).
  async-worker-documents:
    <<: *async-worker
    command:
      - forge-async-worker
      - worker
      - --ensure-schema
      - --queues=documents
      - --concurrency=${ASYNC_WORKER_DOCUMENTS_CONCURRENCY:-4}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      knowledge-s3:
        condition: service_healthy
    environment:
      <<: *async-worker-environment
      HYBRID_ENABLED_TASKS: '["documents"]'
      HYBRID_MONGO__URI: mongodb://${FORGE_MONGO_USER:-forge}:${FORGE_MONGO_PASSWORD:-local-forge}@mongo:27017/?authSource=admin&directConnection=true
      HYBRID_MONGO__DATABASE: ${FORGE_KNOWLEDGE_DATABASE:-forge_knowledge}
      HYBRID_S3__ENDPOINT_URL: http://knowledge-s3:9000
      HYBRID_S3__REGION: us-east-1
      HYBRID_S3__ACCESS_KEY_ID: ${FORGE_S3_ACCESS_KEY_ID:-forge-local}
      HYBRID_S3__SECRET_ACCESS_KEY: ${FORGE_S3_SECRET_ACCESS_KEY:-local-forge-secret}
    healthcheck:
      test: ["CMD", "forge-async-worker", "worker", "--check", "--queues=documents"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 6
    deploy:
      replicas: ${ASYNC_WORKER_DOCUMENTS_REPLICAS:-1}
