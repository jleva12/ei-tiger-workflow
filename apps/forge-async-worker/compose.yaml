# The async worker (forge-async-worker): ADK workflow runs off the
# adk_workflows queue. Redis is a shared service in compose.infrastructure.yaml;
# the runs and their ADK sessions are in the admin MySQL (admin-mysql).
# Included by the root compose.yaml; run make async-worker or make up.
# Settings come from apps/forge-async-worker/.env, whose ${NAME} references
# Compose resolves from .env.common (the root Makefile passes it with
# --env-file); the environment below overrides the connections to reach
# redis and admin-mysql. Its knobs are ASYNC_WORKER_* variables from
# .env.compose, never HYBRID_*: Compose also interpolates this file from
# apps/forge-async-worker/.env, whose native settings must not leak into the
# containers.

# Replicas share the queue; the maintenance cron runs once a minute however
# many serve it.
x-async-worker: &async-worker
  build:
    context: ../..
    dockerfile: apps/forge-async-worker/Dockerfile
  image: forge-async-worker:local
  init: true
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  env_file:
    - path: ./.env
      required: false
  environment: &async-worker-environment
    HYBRID_REDIS_URL: redis://redis:6379/0
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Running runs get 30 seconds to finish, then go back to their queue, and
  # carry on where they were on the next worker.
  stop_grace_period: ${ASYNC_WORKER_STOP_GRACE_PERIOD:-1m}

services:
  # The adk_workflows queue: runs of organizations' ADK workflows, on Google
  # ADK's graph engine. Runs (the run store) and their ADK sessions are in the
  # admin MySQL (admin-mysql, with the admin API's credentials from
  # .env.compose), where the admin API starts, lists and acts on them. A run
  # that waits (an approval, human input, a delay) lets its worker go.
  async-worker-adk-workflows:
    <<: *async-worker
    command:
      - forge-async-worker
      - worker
      - --ensure-schema
      - --queues=adk_workflows
      - --concurrency=${ASYNC_WORKER_ADK_WORKFLOWS_CONCURRENCY:-8}
    depends_on:
      redis:
        condition: service_healthy
      admin-mysql:
        condition: service_healthy
    environment:
      <<: *async-worker-environment
      HYBRID_ADK_WORKFLOWS__SESSION_DATABASE_URL: mysql+aiomysql://${ADMIN_MYSQL_USER:-forge_admin}:${ADMIN_MYSQL_PASSWORD:-local-admin}@admin-mysql:3306/${ADMIN_MYSQL_DATABASE:-forge_admin}
      HYBRID_ADK_WORKFLOWS__GOOGLE_API_KEY: ${FORGE_GOOGLE_API_KEY:-}
    healthcheck:
      test: ["CMD", "forge-async-worker", "worker", "--check", "--queues=adk_workflows"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 6
    deploy:
      replicas: ${ASYNC_WORKER_ADK_WORKFLOWS_REPLICAS:-1}
