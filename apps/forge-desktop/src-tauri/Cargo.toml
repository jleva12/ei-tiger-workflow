[package]
name = "forge-desktop"
version = "0.1.0"
description = "Forge Agents: the chat agents organizations share as chat pages, in a desktop window"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri::generate_context! reads plugins' settings (tauri.conf.json) with it.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
