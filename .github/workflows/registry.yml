# Apps install Forge UI straight from the registry files committed in this
# repo (registry.json and public/r, read from raw.githubusercontent.com), so
# every push must carry a registry that matches the source.
name: Registry

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Registry is built and committed
        run: npm run registry:check
