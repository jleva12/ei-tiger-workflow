# Shared infrastructure for the admin API and the async worker. Included once
# by compose.yaml. The admin API's MySQL (admin-mysql) lives in
# apps/forge-admin-api/compose.yaml.
services:
  # Agent documents (the admin API's forge_admin database: organizations' ADK
  # workflows). Atlas Local runs as a single-node replica set. ADK workflow
  # runs are in the admin MySQL.
  mongo:
    image: mongodb/mongodb-atlas-local:8.3.9
    # Atlas Local derives both the replica-set name and member address from
    # its hostname. Keep it stable across container recreation. Existing
    # volumes must retain their saved replica-set name via .env.compose.
    hostname: ${FORGE_MONGO_HOSTNAME:-mongo}
    restart: unless-stopped
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${FORGE_MONGO_USER:-forge}
      MONGODB_INITDB_ROOT_PASSWORD: ${FORGE_MONGO_PASSWORD:-local-forge}
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:${FORGE_MONGO_PORT:-27037}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "/usr/local/bin/runner", "healthcheck"]
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 30
  # The async worker's SAQ queue (adk_workflows), in database 0, where the
  # admin API queues runs. No eviction of queued jobs; AOF preserves the queue
  # across container recreation.
  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${FORGE_REDIS_PORT:-16389}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # S3-compatible object storage (RustFS) for knowledge base documents: the
  # admin API stores each upload here and the async worker's documents task
  # reads it back to parse, chunk and embed it. Objects persist in a volume;
  # make down keeps them. The admin API creates its bucket on first use
  # (FORGE_ADMIN_S3_CREATE_BUCKET).
  knowledge-s3:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${FORGE_S3_ACCESS_KEY_ID:-forge-local}
      RUSTFS_SECRET_KEY: ${FORGE_S3_SECRET_ACCESS_KEY:-local-forge-secret}
    ports:
      - "127.0.0.1:${FORGE_S3_PORT:-19010}:9000"
    volumes:
      - knowledge-s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:9000/health/live"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
volumes:
  mongo-data:
  mongo-config:
  redis-data:
  knowledge-s3-data:
